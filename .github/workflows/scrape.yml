name: scrape

on:
  schedule:
    # Cron is UTC and doesn't track DST. Times below target Paris in summer
    # (UTC+2); in winter (UTC+1) they fire 1h later.
    - cron: '0 5 * * *'    # 07:00 Paris (summer)
    - cron: '0 10 * * *'   # 12:00 Paris (summer)
    - cron: '0 14 * * *'   # 16:00 Paris (summer)
    - cron: '0 18 * * *'   # 20:00 Paris (summer)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        # BNP is excluded: group.bnpparibas sits behind Akamai Bot Manager
        # which blocks GitHub Actions IP ranges (datacenter ASN reputation).
        # Run BNP locally — see scrapers/bnp/bnp.py.
        #
        # safran.group is excluded for the same reason: www.safran-group.com's WAF
        # IP-blocks GitHub Actions datacenter ranges. curl_cffi clears it from a
        # residential IP (and from CI for L'Oréal/CGI), but Safran rejects the
        # very first listing request from GHA with a 403 (job fails in ~15s,
        # before one listing pass completes). Not a TLS-fingerprint issue — it's
        # IP reputation, so no impersonate profile fixes it. Run it locally:
        #   python run.py safran.group      # see scrapers/safran/group.py
        # (safran.ai — ex-Preligens on a public Lever board — IS CI-safe and is
        #  listed in the matrix below.)
        #
        # Pernod Ricard is kept local as a PRECAUTION (no longer a hard block).
        # Its board is Workday CXS. The site's own FACETED query (jobFamilyGroup +
        # country) is metered by an escalating token bucket that 400s hard on
        # datacenter ASNs and periodically bans all retries. The scraper was
        # therefore rewritten to crawl the UNFACETED endpoint — which is on a
        # separate, far looser budget — and filter France + tech-title client-side
        # (see the module docstring). That is ban-proof on residential IPs. It is
        # still run locally only because the unfaceted budget's behaviour on GitHub
        # Actions IPs is untested; re-enabling CI is a safe experiment if wanted.
        # Run Pernod Ricard locally:
        #   python run.py pernodricard    # see scrapers/pernodricard/pernodricard.py
        company:
          - sanofi
          - loreal
          - accenture
          - orange
          - deezer
          - adobe
          # - thales   # dropped from CI 2026-08-24: Thales requires French
          #            nationality for its clearance-gated roles, so the whole
          #            board is unactionable. Scraper and scrapers/thales/ are
          #            kept intact — run `python run.py thales` if that changes.
          - sg
          - databricks
          - decathlon
          - capgemini
          - voodoo
          - rothschild
          - doctolib
          - cgi
          - allianz
          - ibm
          - totalenergies
          - visa
          - dassault.systemes
          - dassault.aviation
          - creditagricole.carecrute
          - creditagricole.amundi
          - creditagricole.lcl
          - creditagricole.cacib
          - creditagricole.caceis
          - creditagricole.indosuez
          - creditagricole.sofinco
          - creditagricole.bforbank
          - creditagricole.assurances
          - orano
          - soprasteria
          - airbus
          - kering
          - stellantis
          - criteo
          - natixis
          - bpce
          - axa
          - schneider
          - publicis
          - artefact
          - lvmh
          - stripe
          - deloitte
          - wavestone
          - airliquide
          - vinci
          - qonto
          - revolut
          - mirakl
          - datadog
          - bouyguestelecom
          - mckinsey
          - siapartners
          - sap
          - n26
          - salesforce
          - alan
          - ubisoft
          - danone
          - renault
          - richemont
          - veolia
          - morganstanley
          - accor
          - hermes
          - servicenow
          - amazon
          - snowflake
          - cisco
          - disney
          - ipsen
          - airfrance
          - bcg
          - safran.ai
          - mistral
          - dataiku
          - contentsquare
          - valeo
          - huggingface
          - backmarket
          - blablacar
          - ledger
          - ovhcloud
          - michelin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py ${{ matrix.company }}
        env:
          supabasePW: ${{ secrets.supabasePW }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
